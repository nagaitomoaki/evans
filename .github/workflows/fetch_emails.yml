name: Fetch Gmail Emails

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST (UTC 22:00)
  workflow_dispatch:        # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # ファイルをコミット・プッシュするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch emails from Gmail
        env:
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/fetch_emails.py

      - name: Commit and push saved emails
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add emails/ .github/fetch_state.json
          # 変更がない場合はスキップ
          git diff --cached --quiet && echo "変更なし、スキップします" && exit 0
          git commit -m "chore: add emails $(date +'%Y-%m-%d')"
          git push origin main
